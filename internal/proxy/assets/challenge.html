<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>正在进行安全验证</title>
  <style>
    :root {
      --ink: #0f172a;
      --ink-soft: #475569;
      --muted: #64748b;
      --line: #dbe4ef;
      --line-light: #eaf0f6;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --blue-line: #bfdbfe;
      --green: #16a34a;
      --green-soft: #f0fdf4;
      --green-line: #bbf7d0;
      --shadow: 0 22px 56px rgba(15, 23, 42, .12), 0 2px 6px rgba(15, 23, 42, .04);
      --ease-out: cubic-bezier(.23, 1, .32, 1);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background: #eef3f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .site-shell {
      position: relative;
      display: grid;
      min-height: 100vh;
      grid-template-rows: 1fr auto;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 12%, rgba(37, 99, 235, .10), transparent 30rem),
        radial-gradient(circle at 92% 92%, rgba(14, 165, 233, .08), transparent 28rem),
        #f8fafc;
    }
    .site-shell::before {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(148, 163, 184, .10) 1px, transparent 1px), linear-gradient(90deg, rgba(148, 163, 184, .10) 1px, transparent 1px);
      background-size: 40px 40px;
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .5), transparent 70%);
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .5), transparent 70%);
      content: "";
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      padding: 36px 20px 52px;
    }
    .challenge-card {
      width: min(100%, 480px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 17px 20px;
      border-bottom: 1px solid var(--line-light);
      background: #fff;
    }
    .brand-lockup { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--blue-line);
      border-radius: 9px;
      background: var(--blue-soft);
      color: var(--blue);
    }
    .brand-mark svg { width: 18px; height: 18px; }
    .brand-name { display: block; color: #172554; font-size: 12px; font-weight: 800; letter-spacing: .01em; }
    .brand-note { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; }
    .secure-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
      padding: 5px 8px;
      border: 1px solid var(--green-line);
      border-radius: 999px;
      background: var(--green-soft);
      color: #15803d;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .secure-chip::before { width: 6px; height: 6px; border-radius: 999px; background: var(--green); content: ""; }

    .card-body { padding: 31px 32px 26px; }
    .status-emblem {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      margin-bottom: 20px;
      border: 1px solid var(--blue-line);
      border-radius: 16px;
      background: linear-gradient(145deg, #f8fbff 0%, #eaf3ff 100%);
      color: var(--blue);
    }
    .status-emblem svg { width: 28px; height: 28px; }
    h1 { margin: 0; color: var(--ink); font-size: 23px; letter-spacing: -.035em; line-height: 1.22; }
    .lede { margin: 9px 0 0; color: var(--ink-soft); font-size: 13px; line-height: 1.72; }

    .verification-panel {
      margin-top: 25px;
      padding: 16px;
      border: 1px solid var(--line-light);
      border-radius: 13px;
      background: var(--surface-soft);
    }
    .verification-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .verification-heading span:first-child { color: #334155; font-size: 12px; font-weight: 800; }
    .phase { color: var(--blue); font-size: 11px; font-weight: 700; }
    .progress-track { height: 5px; margin-top: 13px; overflow: hidden; border-radius: 999px; background: #dfe8f2; }
    .progress-fill { width: 10%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #2563eb, #60a5fa); transition: width 420ms var(--ease-out); }
    .check-list { display: grid; gap: 12px; margin: 17px 0 0; padding: 0; list-style: none; }
    .check-item { display: flex; align-items: center; gap: 10px; min-height: 20px; color: #64748b; font-size: 12px; transition: color 180ms ease; }
    .check-icon { display: grid; width: 18px; height: 18px; place-items: center; flex: 0 0 auto; border: 1px solid #cbd5e1; border-radius: 50%; background: #fff; color: #94a3b8; font-size: 11px; font-weight: 800; transition: all 180ms var(--ease-out); }
    .check-item.active { color: #334155; }
    .check-item.active .check-icon { border-color: #93c5fd; color: var(--blue); }
    .check-item.done { color: #15803d; }
    .check-item.done .check-icon { border-color: var(--green-line); background: var(--green-soft); color: var(--green); }
    .spinner { width: 10px; height: 10px; border: 1.5px solid #bfdbfe; border-top-color: var(--blue); border-radius: 50%; animation: spin 650ms linear infinite; }
    @keyframes spin { to { transform: rotate(1turn); } }

    .privacy-note { display: flex; gap: 8px; margin: 19px 0 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .privacy-note svg { width: 15px; height: 15px; flex: 0 0 auto; margin-top: 1px; color: #64748b; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 25px; padding-top: 16px; border-top: 1px solid var(--line-light); color: #94a3b8; font-size: 10.5px; }
    .protocols { display: inline-flex; align-items: center; gap: 7px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .protocols span + span::before { margin-right: 7px; color: #cbd5e1; content: "•"; }

    .site-footer { position: relative; z-index: 1; padding: 0 20px 19px; color: #94a3b8; font-size: 11px; text-align: center; }
    .site-footer strong { color: #64748b; font-weight: 700; }

    @media (prefers-reduced-motion: no-preference) {
      .challenge-card { animation: card-in 360ms var(--ease-out) both; }
      @keyframes card-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
    @media (max-width: 520px) {
      main { padding: 22px 14px 34px; }
      .card-header { padding: 14px 16px; }
      .card-body { padding: 25px 20px 21px; }
      h1 { font-size: 21px; }
      .secure-chip { font-size: 9px; }
    }
  </style>
</head>
<body>
  <div class="site-shell">
    <main>
      <section class="challenge-card" aria-labelledby="challenge-title" aria-describedby="challenge-description">
        <header class="card-header">
          <div class="brand-lockup">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3 5 6v5c0 4.4 3 7.8 7 9.3 4-1.5 7-4.9 7-9.3V6l-7-3Z"/><path d="m9.2 11.8 1.8 1.8 3.9-4"/></svg>
            </span>
            <span><span class="brand-name">ZHIYU-WAF V2</span><span class="brand-note">Local security verification</span></span>
          </div>
          <span class="secure-chip">安全连接</span>
        </header>

        <div class="card-body">
          <div class="status-emblem" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 5 6v5c0 4.4 3 7.8 7 9.3 4-1.5 7-4.9 7-9.3V6l-7-3Z"/><path d="M9 12h6M12 9v6"/></svg>
          </div>
          <h1 id="challenge-title">正在进行安全验证</h1>
          <p class="lede" id="challenge-description">为保护当前站点免受自动化访问与异常请求影响，我们正在确认浏览器环境。此过程通常在数秒内自动完成。</p>

          <div class="verification-panel" aria-live="polite" aria-atomic="true">
            <div class="verification-heading"><span>验证进度</span><span class="phase" id="phase">准备中</span></div>
            <div class="progress-track" role="progressbar" aria-label="安全验证进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="10"><div class="progress-fill" id="progressFill"></div></div>
            <ul class="check-list">
              <li class="check-item active" id="check1"><span class="check-icon"><span class="spinner"></span></span><span>正在检查浏览器环境</span></li>
              <li class="check-item" id="check2"><span class="check-icon">2</span><span>正在校验访问完整性</span></li>
              <li class="check-item" id="check3"><span class="check-icon">3</span><span>正在建立受保护连接</span></li>
            </ul>
          </div>

          <p class="privacy-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>验证仅用于保护站点访问，不会要求输入密码、支付信息或个人敏感数据。</span></p>

          <footer class="card-footer"><span>请勿关闭此页面</span><span class="protocols"><span>TLS</span><span>Local Check</span></span></footer>
        </div>
      </section>
    </main>
    <footer class="site-footer"><strong>ZHIYU-WAF V2</strong> · 本地优先的访问保护</footer>
  </div>

  <script>
    (function () {
      var checks = [document.getElementById('check1'), document.getElementById('check2'), document.getElementById('check3')];
      var fill = document.getElementById('progressFill');
      var progress = document.querySelector('[role="progressbar"]');
      var phase = document.getElementById('phase');
      var labels = ['浏览器检查', '完整性校验', '安全连接'];

      function markDone(index) {
        var item = checks[index];
        item.className = 'check-item done';
        item.querySelector('.check-icon').innerHTML = '&#10003;';
      }
      function markActive(index) {
        var item = checks[index];
        item.className = 'check-item active';
        item.querySelector('.check-icon').innerHTML = '<span class="spinner"></span>';
      }
      function setProgress(value, text) {
        fill.style.width = value + '%';
        progress.setAttribute('aria-valuenow', value);
        phase.textContent = text;
      }
      function verify() {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/__zhiyu_waf_verify', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.onload = function () { if (xhr.status === 200) window.location.reload(); };
        xhr.send('{}');
      }

      setTimeout(function () { setProgress(34, labels[0]); }, 260);
      setTimeout(function () { markDone(0); markActive(1); setProgress(66, labels[1]); }, 850);
      setTimeout(function () { markDone(1); markActive(2); setProgress(88, labels[2]); }, 1460);
      setTimeout(function () { markDone(2); setProgress(100, '验证完成'); }, 2140);
      setTimeout(2440, verify);
    }());
  </script>
</body>
</html>
