# ZHIYU-WAF V2 local-first configuration.
proxy:
  # Let your existing ingress proxy / load balancer route traffic to this port.
  listen_addr: ":8080"
  backend_addr: "127.0.0.1:80"
  read_timeout: 30
  write_timeout: 30
  dynamic_protect: false
  # Forwarded headers are honored only from these direct peers.
  trusted_proxies:
    - "127.0.0.1/32"
    - "::1/128"
  # TLS termination is optional; keep certificates outside the repository.
  # tls_cert_file: "/opt/zhiyu-waf/certs/fullchain.pem"
  # tls_key_file: "/opt/zhiyu-waf/certs/privkey.pem"

dashboard:
  listen_addr: ":9090"
  # Leave blank on first run to generate a random local secret, or set via a secret manager.
  jwt_secret: ""
  cors_origins:
    - "http://localhost:9090"
    - "http://127.0.0.1:9090"

# AI is optional, asynchronous, and fail-open. The V2 core never requires an external API.
ai:
  enabled: false
  provider: "openai"
  async_timeout: 5
  cache_ttl: 300
  max_requests_per_min: 60
  fail_open: true
  per_ip_rate: 10
  per_ip_burst: 2
  circuit_threshold: 5
  circuit_reset: 30
  providers:
    openai:
      api_key: ""
      model: ""
      base_url: ""

engine:
  rules_dir: "./configs/rules"
  rate_limit:
    requests_per_minute: 60
    burst_size: 10

# SSH brute-force blocks use the same V2 nftables interface and local SQLite audit trail.
ssh:
  enabled: true
  log_path: ""
  max_fails: 5
  ban_minutes: 30

storage:
  path: "./data/zhiyu-waf.db"
