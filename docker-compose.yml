version: "3.8"

services:
  waf:
    build: .
    container_name: zhiyu-waf
    restart: unless-stopped
    volumes:
      - waf-data:/opt/zhiyu-waf/data
      - ./configs:/opt/zhiyu-waf/configs:ro
    environment:
      - ZHIYU_WAF_JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ZHIYU_WAF_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ZHIYU_WAF_OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
    cap_add:
      - NET_ADMIN     # Required only when V2 should synchronize malicious IPs to host nftables.
    # host networking lets the container manage the host nftables namespace.
    # Omit NET_ADMIN and use normal ports when application-layer-only protection is sufficient.
    network_mode: host

volumes:
  waf-data:
